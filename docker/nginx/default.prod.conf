# ─── 1. Restaura o IP Real do Visitante vindo da Cloudflare ──────────────────
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ─── 2. Mapeamento Anti-Bypass: Conexão TCP originada da Cloudflare? ─────────
geo $realip_remote_addr $is_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
    127.0.0.1 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

# ─── 3. Default Server: Bloqueia qualquer acesso direto por IP ────────────────
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/api.doispalitos.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.doispalitos.tech/privkey.pem;

    # Fecha imediatamente a conexão sem enviar headers nem corpo
    return 444;
}

# ─── 4. Redirecionamento HTTP para HTTPS (com suporte a renovação ACME) ───────
server {
    listen 80;
    server_name api.doispalitos.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/backend/public;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── 5. Servidor HTTPS Principal (api.doispalitos.tech) ───────────────────────
server {
    listen 443 ssl;
    server_name api.doispalitos.tech;

    ssl_certificate /etc/letsencrypt/live/api.doispalitos.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.doispalitos.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Anti-Bypass: Se a requisição não veio de um IP oficial da Cloudflare, bloqueia
    if ($is_cloudflare = 0) {
        return 403 "Acesso direto bloqueado. Utilize o domínio oficial protegido.";
    }

    root /var/www/backend/public;
    index index.php;

    charset utf-8;

    # Headers de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/backend/public;
        allow all;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Repassa o IP Real para o PHP-FPM
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 120;
        fastcgi_read_timeout 120;
    }

    location ~* ^/storage/.*\.php$ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* \.(env|git|sql|yaml|yml|log|conf)$ {
        deny all;
        return 404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}