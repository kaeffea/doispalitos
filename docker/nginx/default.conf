server {
    listen 80;
    server_name _;

    root /var/www/backend/public;
    index index.php;

    charset utf-8;

    # ─── Segurança: headers ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Esconde versão do Nginx ──────────────────────────────────────────────
    server_tokens off;

    # ─── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ─── Laravel: roteamento ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── Permite validação de certificado SSL (Certbot ACME) ─────────────────
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/backend/public;
        allow all;
    }

    # ─── Bloqueia acesso a arquivos ocultos (.env, .git, etc.) ───────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ─── PHP-FPM ──────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 120;
        fastcgi_read_timeout 120;
    }

    # ─── Bloqueia execução de scripts PHP em pastas de upload/storage ────────
    location ~* ^/storage/.*\.php$ {
        deny all;
        return 404;
    }

    # ─── Bloqueia acesso a arquivos ocultos e arquivos de config sensíveis ───
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* \.(env|git|sql|yaml|yml|log|conf)$ {
        deny all;
        return 404;
    }

    # ─── Cache de assets estáticos ────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
